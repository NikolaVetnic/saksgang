spring.application.name=sak-api

# Local development defaults matching infra/docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/saksgang
spring.datasource.username=saksgang
spring.datasource.password=saksgang

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
