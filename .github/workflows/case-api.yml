name: case-api

on:
  push:
    branches: [main]
    paths:
      - "case-api/**"
      - ".github/workflows/case-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "case-api/**"
      - ".github/workflows/case-api.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: case-api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: case-api/pom.xml

      # Testcontainers uses the Docker daemon that is preinstalled on GitHub-hosted runners
      - name: Build and run all tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            case-api/target/surefire-reports/
            case-api/target/failsafe-reports/
