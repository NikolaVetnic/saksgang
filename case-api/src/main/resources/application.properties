spring.application.name=case-api

# Local development defaults matching infra/docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/saksgang
spring.datasource.username=saksgang
spring.datasource.password=saksgang

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Fail on startup instead of silently skipping misnamed migration files
spring.flyway.validate-migration-naming=true

brreg.base-url=https://data.brreg.no
brreg.connect-timeout=2s
brreg.read-timeout=5s

management.endpoints.web.exposure.include=health,info
