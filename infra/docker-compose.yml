name: saksgang

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: saksgang
      POSTGRES_USER: saksgang
      POSTGRES_PASSWORD: saksgang
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saksgang -d saksgang"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
